name: Daily Trend Scraper + Pinterest

on:
  schedule:
    - cron: "0 7 * * *"   # täglich 08:00 Uhr Wien
  workflow_dispatch:

jobs:
  scrape-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies installieren
        run: pip install -r requirements.txt

      - name: Trends scrapen
        run: python scraper.py

      - name: Pinterest Pins posten
        env:
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
        run: python pinterest_poster.py

      - name: Deploy zu GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
